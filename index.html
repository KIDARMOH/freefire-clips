
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Fire Shots</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>شارك لقطاتك في فري فاير</h1>
    <form id="upload-form">
      <input type="text" id="player-name" placeholder="اسم اللاعب" required />
      <input type="file" id="shot-file" accept="video/*,image/*" required />
      <textarea id="description" placeholder="وصف اللقطة" required></textarea>
      <button type="submit">نشر</button>
    </form>
    <div id="gallery" class="gallery"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
